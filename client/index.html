<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ball Fall</title>
<style>
:root{--ink:#1b1147;--ink2:#2c1d73;--coral:#ff5d73;--lemon:#ffd23f;--mint:#2ee6a6;--sky:#4dabff;--grape:#9b5de5;--tx:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--tx);font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#ui{position:fixed;inset:0;overflow:auto;background:radial-gradient(circle at 12% 18%,#ff5d7344 0 120px,transparent 121px),radial-gradient(circle at 88% 78%,#4dabff44 0 180px,transparent 181px),radial-gradient(circle at 70% 12%,#ffd23f33 0 80px,transparent 81px),radial-gradient(circle at 25% 88%,#2ee6a633 0 110px,transparent 111px),linear-gradient(160deg,#2c1d73,#1b1147 70%)}
#ui:empty{display:none}
h1{margin:0;font-size:clamp(40px,7vw,76px);letter-spacing:-2px;line-height:1;text-shadow:0 5px 0 #0006}h1 b{color:var(--lemon)}h1 em{color:var(--coral);font-style:normal}
h2{margin:0 0 12px;font-size:26px}small{opacity:.75}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.card{background:#ffffff14;border:2px solid #ffffff26;border-radius:22px;padding:14px 18px}
.me{display:flex;gap:14px;align-items:center}
.ball{--c:#f69;position:relative;display:inline-block;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff9 0 8%,transparent 20%),var(--c);box-shadow:inset -6px -8px 0 #0003,0 5px 0 #0004;flex:none}
.ball i{position:absolute;top:38%;width:20%;height:26%;border-radius:50%;background:#fff;box-shadow:inset 0 -4px 0 #222}.ball i:first-child{left:22%}.ball i:last-child{right:22%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;margin-right:4px}.dot.on{background:var(--mint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.layout{display:grid;grid-template-columns:1fr 280px;gap:18px}@media(max-width:820px){.layout{grid-template-columns:1fr}}
.btn{font:inherit;font-size:18px;color:#1b1147;background:var(--lemon);border:0;border-radius:18px;padding:16px 18px;cursor:pointer;box-shadow:0 6px 0 #0000004d;transition:transform .08s,box-shadow .08s;text-align:left}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0000004d}
.btn.mint{background:var(--mint)}.btn.coral{background:var(--coral);color:#fff}.btn.sky{background:var(--sky)}.btn.grape{background:var(--grape);color:#fff}.btn.ghost{background:#ffffff1f;color:#fff}.btn.soon{opacity:.45}
.btn.big{grid-column:span 2;font-size:26px;padding:24px 22px}.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid #ffffff1c}th{opacity:.7;font-weight:600}
input,select{font:inherit;background:#0003;color:#fff;border:2px solid #ffffff30;border-radius:12px;padding:10px 12px;width:100%}input[type=range]{padding:0}input[type=color]{padding:2px;height:42px}
label{display:block;margin:12px 0 4px;opacity:.85;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;background:#ffffff22}.tag.w{background:var(--lemon);color:#1b1147}.tag.g{background:var(--mint);color:#1b1147}.tag.r{background:var(--coral)}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:3px;cursor:pointer;border:3px solid #fff3}.sw.on{border-color:#fff}
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}.panel{background:var(--ink2);border:3px solid #ffffff30;border-radius:26px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
#busy{position:fixed;inset:0;z-index:40;background:#1b1147ee;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;font-size:24px;text-align:center;padding:20px}
.spin{width:64px;height:64px;border-radius:50%;border:9px solid #ffffff30;border-top-color:var(--lemon);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
#net{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:50;background:var(--coral);padding:8px 18px;border-radius:0 0 16px 16px;font-size:15px}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}#toast div{background:#000b;padding:10px 18px;border-radius:14px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#0007;border-radius:16px;padding:6px 18px;display:flex;gap:18px;align-items:center;font-size:18px}#tm{font-size:26px}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #000a}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:3px solid var(--coral);border-radius:50%;opacity:0;transition:opacity .25s}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px #ff2040;opacity:0;transition:opacity .4s}
#kf{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}#kf div{background:#0008;padding:5px 12px;border-radius:12px;font-size:15px}
#ann{position:absolute;top:22%;width:100%;text-align:center;font-size:34px;text-shadow:0 4px 0 #0008}
#cd{position:absolute;top:34%;width:100%;text-align:center;font-size:120px;text-shadow:0 8px 0 #0008;color:var(--lemon)}
#bars{position:absolute;left:18px;bottom:18px;width:260px}.bar{height:18px;border-radius:10px;background:#0007;overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;transition:width .12s}.hp i{background:var(--mint)}.sh i{background:var(--sky)}
#ammo{position:absolute;right:18px;bottom:18px;text-align:right}#am{font-size:54px}#mg{font-size:22px;opacity:.8}#wn{font-size:16px}
#slots{display:flex;gap:5px;margin-top:6px;justify-content:flex-end}#slots span{width:28px;height:28px;border-radius:8px;background:#0007;display:grid;place-items:center;font-size:14px;border:2px solid transparent}#slots span.on{border-color:#fff}
#sb,#pause,#em{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1b1147ee;border:3px solid #ffffff30;border-radius:24px;padding:20px;min-width:340px;max-width:92vw;max-height:84vh;overflow:auto}
#em{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center}#em div{background:#ffffff18;border-radius:16px;padding:10px 14px;font-size:34px}#em small{display:block;font-size:12px}
#chat{position:fixed;left:18px;bottom:96px;width:min(380px,80vw);z-index:6;pointer-events:none}#log div{background:#0007;border-radius:10px;padding:4px 10px;margin-top:3px;font-size:15px;width:fit-content;max-width:100%}
#cin{pointer-events:auto;margin-top:6px}#cin .row{gap:6px}#cin select{width:auto;flex:none}#qk{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}#qk button{font:inherit;font-size:13px;border:0;border-radius:99px;padding:5px 10px;background:#ffffff2a;color:#fff;cursor:pointer}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
 <div id="top"><span id="rd"></span><b id="tm">0:00</b><span id="sc"></span></div>
 <div id="cross"></div><div id="hitm"></div><div id="vig"></div><div id="kf"></div><div id="ann"></div><div id="cd"></div>
 <div id="bars"><div class="bar sh"><i id="shb"></i></div><div class="bar hp"><i id="hpb"></i></div></div>
 <div id="ammo"><b id="am">0</b><span id="mg"></span><div id="wn"></div><div id="slots"></div></div>
 <div id="sb" class="hide"></div><div id="pause" class="hide"></div><div id="em" class="hide"></div>
</div>
<div id="chat" class="hide"><div id="log"></div><div id="cin" class="hide"><div class="row"><select id="cch"><option value="all">Geral</option><option value="team">Equipe</option></select><input id="ctx" maxlength="140" placeholder="Digite e aperte Enter" autocomplete="off"></div><div id="qk"></div></div></div>
<div id="ui"></div><div id="modal" class="hide"></div><div id="busy" class="hide"></div><div id="net" class="hide"></div><div id="toast"></div>
<script type="module" src="/main.ts"></script>
</body></html>
